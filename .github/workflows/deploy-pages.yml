name: Deploy to GitHub Pages

# Publica os arquivos estáticos (index.html, assets/, data/) no GitHub Pages.
# No Pages não há back-end: o front-end usa o store em memória, semeado por
# data/seed.json. Localmente, use `npm start` para a API real do json-server.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
